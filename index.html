<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Material Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #334155;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .config-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 16px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
    }
    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: var(--border);
    }
    .btn-secondary:hover {
      background: #475569;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .grid-layout, .config-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th {
      background: #182234;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-ok {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .badge-warn {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .action-group {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      padding: 4px 8px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Laboratory Inventory Control</h1>
      <span id="connection-status" class="badge badge-warn">Disconnected</span>
    </header>

    <!-- Supabase Configuration Panel -->
    <div class="config-card">
      <div class="config-grid">
        <div class="form-group">
          <label>Supabase Project URL</label>
          <input type="text" id="supabase-url" placeholder="https://xxxxxxxx.supabase.co">
        </div>
        <div class="form-group">
          <label>Supabase Anon Key</label>
          <input type="password" id="supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6...">
        </div>
        <button onclick="initializeSupabase()">Connect Database</button>
      </div>
    </div>

    <div class="grid-layout">
      <!-- Add Material Form -->
      <div class="card">
        <h2 style="font-size: 1.15rem; margin-bottom: 16px;">Add Lab Item</h2>
        <form id="material-form" onsubmit="handleCreateMaterial(event)" style="display: flex; flex-direction: column; gap: 14px;">
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="mat-name" required placeholder="e.g., Ethanol 99%">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="mat-category" required>
              <option value="Chemicals">Chemicals</option>
              <option value="Reagents">Reagents</option>
              <option value="Glassware">Glassware</option>
              <option value="Consumables">Consumables</option>
              <option value="Equipment">Equipment</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" step="0.01" id="mat-qty" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Unit</label>
            <input type="text" id="mat-unit" required placeholder="Liters, kg, pcs, boxes">
          </div>
          <div class="form-group">
            <label>Min. Threshold Alert</label>
            <input type="number" step="0.01" id="mat-threshold" required placeholder="Alert level">
          </div>
          <div class="form-group">
            <label>Storage Location</label>
            <input type="text" id="mat-location" required placeholder="e.g., Cabinet D-4">
          </div>
          <button type="submit">Save Material</button>
        </form>
      </div>

      <!-- Inventory Table -->
      <div class="card table-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 style="font-size: 1.15rem;">Live Stock Inventory</h2>
          <button class="btn-secondary" onclick="fetchMaterials()" style="font-size: 0.8rem; padding: 6px 12px;">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Material</th>
              <th>Category</th>
              <th>Stock</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted);">Connect your database above to load records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;

    // Load credentials from local storage if saved
    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem("postgresql://postgres.yeydscvvujnekicsbdxi:CloudLabCts%40Festo%40123456@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres");
      const savedKey = localStorage.getItem("sb_publishable_uBh_Q_7YFakzCqHknzb1tw_4qj3_7eI");
      if (savedUrl && savedKey) {
        document.getElementById('supabase-url').value = SUPABASE_URL;
        document.getElementById('supabase-key').value = SUPABASE_ANON_KEY;
        initializeSupabase();
      }
    });

    function initializeSupabase() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();

      if (!url || !key) {
        alert('Please provide both Supabase URL and Anon Key.');
        return;
      }

      try {
        supabaseClient = supabase.createClient(url, key);
        localStorage.setItem('sb_url', url);
        localStorage.setItem('sb_key', key);

        const statusBadge = document.getElementById('connection-status');
        statusBadge.textContent = 'Connected';
        statusBadge.className = 'badge badge-ok';

        fetchMaterials();
      } catch (err) {
        alert('Connection error: ' + err.message);
      }
    }

    async function fetchMaterials() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('lab_materials')
        .select('*')
        .order('name', { ascending: true });

      if (error) {
        alert('Failed to fetch data: ' + error.message);
        return;
      }

      const tbody = document.getElementById('inventory-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No materials found.</td></tr>';
        return;
      }

      data.forEach(item => {
        const isLow = Number(item.quantity) <= Number(item.minimum_threshold);
        const statusBadge = isLow 
          ? `<span class="badge badge-warn">Low Stock</span>`
          : `<span class="badge badge-ok">Optimal</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>${item.category}</td>
          <td>${item.quantity} ${item.unit}</td>
          <td>${item.storage_location}</td>
          <td>${statusBadge}</td>
          <td>
            <div class="action-group">
              <button class="action-btn" onclick="adjustQuantity('${item.id}', ${item.quantity}, 1)">+1</button>
              <button class="action-btn btn-secondary" onclick="adjustQuantity('${item.id}', ${item.quantity}, -1)">-1</button>
              <button class="action-btn btn-danger" onclick="deleteMaterial('${item.id}')">Del</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function handleCreateMaterial(event) {
      event.preventDefault();
      if (!supabaseClient) {
        alert('Connect to Supabase first.');
        return;
      }

      const newMaterial = {
        name: document.getElementById('mat-name').value.trim(),
        category: document.getElementById('mat-category').value,
        quantity: parseFloat(document.getElementById('mat-qty').value),
        unit: document.getElementById('mat-unit').value.trim(),
        minimum_threshold: parseFloat(document.getElementById('mat-threshold').value),
        storage_location: document.getElementById('mat-location').value.trim()
      };

      const { error } = await supabaseClient
        .from('lab_materials')
        .insert([newMaterial]);

      if (error) {
        alert('Insertion failed: ' + error.message);
      } else {
        document.getElementById('material-form').reset();
        fetchMaterials();
      }
    }

    async function adjustQuantity(id, currentQty, delta) {
      if (!supabaseClient) return;
      const updatedQty = Math.max(0, Number(currentQty) + delta);

      const { error } = await supabaseClient
        .from('lab_materials')
        .update({ quantity: updatedQty })
        .eq('id', id);

      if (error) {
        alert('Stock update failed: ' + error.message);
      } else {
        fetchMaterials();
      }
    }

    async function deleteMaterial(id) {
      if (!confirm('Are you sure you want to remove this item?')) return;
      if (!supabaseClient) return;

      const { error } = await supabaseClient
        .from('lab_materials')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Deletion failed: ' + error.message);
      } else {
        fetchMaterials();
      }
    }
  </script>
</body>
</html>
